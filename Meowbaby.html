<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Boyfie 💕</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* soft overlay so text is readable */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255,255,255,0.9);
      padding: 30px 20px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 350px;
      width: 90%;
      z-index: 2;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 22px;
      color: #ff6f91;
      margin-bottom: 20px;
    }

    .cat {
      font-size: 48px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #ffb3c6;
      color: #fff;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff8fab;
      transform: translateY(-2px);
    }

    .magic {
      background: #b28dff;
    }

    .magic:hover {
      background: #9a6bff;
    }
  </style>
</head>

<body>

  <audio id="meowSound">
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_8b7b1c1a9b.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="step1">
    <div class="cat">🐱💗</div>
    <h1>Do you miss your baby princess girlfriend?</h1>
    <button onclick="nextStep()">Yes I do!</button>
    <button onclick="nextStep()">YESSSSSSS!</button>
  </div>

  <div class="card" id="step2" style="display:none;">
    <div class="cat">🐾✨</div>
    <h1>Press this button for some magic</h1>
    <button class="magic" onclick="goMagic()">Magic Button</button>
  </div>

  <script>
    const meow = document.getElementById("meowSound");

    function playMeow() {
      meow.currentTime = 0;
      meow.play();
    }

    function nextStep() {
      playMeow();
      document.getElementById("step1").style.display = "none";
      document.getElementById("step2").style.display = "block";
    }

    function goMagic() {
      playMeow();
      window.location.href =
        "https://wa.me/94765408359?text=Baby%20I%20miss%20you%20%E2%9D%A4%EF%B8%8F";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 600);
  </script>

</body>
</html>
